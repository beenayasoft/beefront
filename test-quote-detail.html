<!DOCTYPE html>
<html>
<head>
    <title>Test QuoteDetail API</title>
</head>
<body>
    <h1>Test QuoteDetail</h1>
    <button onclick="testQuoteDetail()">Test Quote Detail API</button>
    <div id="result"></div>

    <script>
        async function testQuoteDetail() {
            const quoteId = 'cf459060-2f05-471d-8297-94e78d38fdf7';
            const tenantId = '31f96c39-bd7f-453e-a7f1-88495e70272b';
            
            try {
                const response = await fetch(`http://localhost:8000/api/quotes/${quoteId}/`, {
                    headers: {
                        'X-Tenant-ID': tenantId,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h2>Succès!</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Erreur:</h2>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
